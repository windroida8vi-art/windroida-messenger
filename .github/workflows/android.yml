name: Build Windroida APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      WD_KS_PASS: ${{ secrets.WD_KS_PASS }}
      WD_KEY_ALIAS: ${{ secrets.WD_KEY_ALIAS }}
      WD_KEY_PASS: ${{ secrets.WD_KEY_PASS }}
      HAVE_KEY: ${{ secrets.WD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      # With the secret WD_KEYSTORE_B64 (base64 of your windroida.jks) the APK is a release APK signed with YOUR permanent key.
      # Without it, falls back to the old debug APK.
      - name: Restore signing key
        if: env.HAVE_KEY == 'true'
        run: echo "${{ secrets.WD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/windroida.jks"
      - name: Build release (signed with your key)
        if: env.HAVE_KEY == 'true'
        run: WD_KEYSTORE="$RUNNER_TEMP/windroida.jks" gradle --no-daemon assembleRelease
      - name: Build debug (no key configured)
        if: env.HAVE_KEY != 'true'
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: windroida-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
